[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mantis-xray"
authors = [
	{name = "Mirna Lerotic", email = "mirna@2ndlookconsulting.com"},
]
description = "MANTiS is a Multivariate ANalysis Tool for x-ray Spectromicroscopy"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["spectromicroscopy", "microspectroscopy", "stxm", "hyperspectral", "imaging", "image"]
license = "GPL-3.0-or-later"
classifiers = [
	"Development Status :: 5 - Production/Stable",
	"Programming Language :: Python",
	"Programming Language :: Python :: 3",
	"Operating System :: OS Independent",
	"Topic :: Scientific/Engineering",
	"Topic :: Scientific/Engineering :: Image Processing",
	"Topic :: Scientific/Engineering :: Visualization",
	"Intended Audience :: Science/Research"
]
dependencies = [
	'numpy',
	'scipy>=1.11.4', 
	'matplotlib>=3.6.0', 
	'h5py', 
	'Pillow', 
	'lxml', 
	"scikit-image>=0.19.1",
	"xdrlib3"
]
dynamic = ["version"]

[project.urls]
homepage = "https://spectromicroscopy.com"
documentation = "https://docs.spectromicroscopy.com"
source = "https://github.com/mlerotic/spectromicroscopy"
issues = "https://github.com/mlerotic/spectromicroscopy/issues"

[project.optional-dependencies]
netCDF = ["netCDF4"]
xrm = ["olefile"]
dev = ["pytest>=8", "build", "pyinstaller>=6"]

[project.scripts]
mantis-xray = "mantis_xray.cli:main"
mantis = "mantis_xray.cli:main"
mantis-engine = "mantis_xray.service:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["mantis_xray*"]

[tool.setuptools.package-data]
"mantis_xray" = ["Mantis_batch_settings.txt"]
"mantis_xray.analysis" = ["*.xdr"]


[tool.setuptools.dynamic]
version = {attr = "mantis_xray.__version__"}
