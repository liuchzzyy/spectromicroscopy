name: Python distribution (library, engine and CLI)
on:
  push:
    paths: ['mantis_xray/**', 'tests/**', 'pyproject.toml', 'MANIFEST.in', 'pytest.ini', 'scripts/check_distributions.py', '.github/workflows/python.yml']
  pull_request:
    paths: ['mantis_xray/**', 'tests/**', 'pyproject.toml', 'MANIFEST.in', 'pytest.ini', 'scripts/check_distributions.py', '.github/workflows/python.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev,xrm,netCDF]'
      - run: python -m pytest -q
      - run: python -m build --outdir dist/python .
      - run: python scripts/check_distributions.py
      - uses: actions/upload-artifact@v4
        with:
          name: python-distribution-${{ matrix.python }}
          path: dist/python/*
