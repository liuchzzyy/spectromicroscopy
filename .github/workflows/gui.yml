name: Native macOS GUI (arm64 DMG)
on:
  push:
    paths: ['GUI/**', 'mantis_xray/**', 'scripts/**', 'pyproject.toml', 'uv.lock', '.python-version', '.github/workflows/gui.yml']
  pull_request:
    paths: ['GUI/**', 'mantis_xray/**', 'scripts/**', 'pyproject.toml', 'uv.lock', '.python-version', '.github/workflows/gui.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.12.23'
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked --python 3.12 --all-extras
      - run: swift test --package-path GUI -c release
      - run: bash scripts/build_gui.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Mantis-native-arm64
          path: |
            dist/GUI/*.dmg
            dist/GUI/*.dmg.sha256
